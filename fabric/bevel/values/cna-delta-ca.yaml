global:
  serviceAccountName: bevel-auth
  cluster:
    provider: minikube
    cloudNativeServices: false
  vault:
    type: kubernetes
    role: vault-role
    network: fabric
    address: ""
    authPath: cna-delta
    secretEngine: secretsv2
    secretPrefix: "data/cna-delta"
    tls: false
  proxy:
    provider: none
    externalUrlSuffix: cve.local
storage:
  size: 256Mi
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
  allowedTopologies:
    enabled: false
image:
  alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
  ca: ghcr.io/hyperledger/bevel-fabric-ca:latest
  pullSecret:
server:
  removeCertsOnDelete: true
  tlsStatus: true
  adminUsername: cna-delta-admin
  adminPassword: cna-delta-adminpw
  subject: "/C=IN/ST=Gujarat/L=Ahmedabad/O=CNADelta/CN=cna-delta-ca"
  configPath: ""
  nodePort:
  clusterIpPort: 7054
labels:
  service: []
  pvc: []
  deployment: []
