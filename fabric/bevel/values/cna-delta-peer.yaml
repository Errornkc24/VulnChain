global:
  version: 2.5.4
  serviceAccountName: bevel-auth
  cluster:
    provider: minikube
    cloudNativeServices: false
  vault:
    type: kubernetes
    role: vault-role
    address: ""
    authPath: cna-delta
    secretEngine: secretsv2
    secretPrefix: "data/cna-delta"
    tls: false
  proxy:
    provider: none
    externalUrlSuffix: cve.local
    port: 443
storage:
  enabled: true
  peer: 512Mi
  couchdb: 512Mi
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
  allowedTopologies:
    enabled: false
certs:
  generateCertificates: false
  orgData:
    caAddress: ca-cna-delta.cna-delta-ns:7054
    caAdminUser: cna-delta-admin
    caAdminPassword: cna-delta-adminpw
    orgName: cna-delta
    type: peer
    componentSubject: "O=CNADelta,L=Ahmedabad,C=IN"
  settings:
    createConfigMaps: true
    refreshCertValue: false
    addPeerValue: false
    removeCertsOnDelete: false
    removeOrdererTlsOnDelete: false
image:
  couchdb: couchdb:3.3
  peer: ghcr.io/hyperledger/bevel-fabric-peer
  alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
  pullSecret:
peer:
  gossipPeerAddress: peer0-cna-delta.cna-delta-ns:13051
  logLevel: info
  localMspId: CNADeltaMSP
  tlsStatus: true
  cliEnabled: false
  ordererAddress: orderer0.orderer-ns:7050
  builder: hyperledger/fabric-ccenv
  couchdb:
    username: cnadeltaadmin
    password: cnadeltaadminpw
  mspConfig:
    organizationalUnitIdentifiers:
    nodeOUs:
      clientOUIdentifier: client
      peerOUIdentifier: peer
      adminOUIdentifier: admin
      ordererOUIdentifier: orderer
  serviceType: NodePort
  loadBalancerType: ""
  ports:
    grpc:
      nodePort: 32051
      clusterIpPort: 13051
    events:
      nodePort: 32052
      clusterIpPort: 13053
    couchdb:
      nodePort: 32084
      clusterIpPort: 5984
    metrics:
      enabled: false
      clusterIpPort: 9443
  resources:
    limits:
      memory: 1Gi
      cpu: 1
    requests:
      memory: 512M
      cpu: 0.25
  upgrade: false
  healthCheck:
    retries: 20
    sleepTimeAfterError: 15
labels:
  service: []
  pvc: []
  deployment: []
